[project]
name = "a-share-research"
version = "0.0.0"
description = "Post-close A-share single-company research assistant"
requires-python = ">=3.13"
dependencies = [
    "a-stock-lib[tushare] @ https://github.com/on195594/a-stock-lib/releases/download/v0.10.2/a_stock_lib-0.10.2-py3-none-any.whl#sha256=630d9aac557a62a6c475b51d7a6c3e94d1953928dd9473f4604c1d910b301bcf",
    "fastapi>=0.156.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "requests>=2.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
