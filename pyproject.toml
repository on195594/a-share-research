[project]
name = "a-share-research"
version = "0.0.0"
description = "Post-close A-share single-company research assistant"
requires-python = ">=3.13"
dependencies = [
    "a-stock-lib[tushare] @ https://github.com/on195594/a-stock-lib/releases/download/v0.8.2/a_stock_lib-0.8.2-py3-none-any.whl#sha256=cae49d9d7e71605a5543c1db93a18fd4f305e910a3d5060fde9028ff2d5a324c",
    "fastapi>=0.156.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "requests>=2.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
