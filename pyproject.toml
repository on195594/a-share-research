[project]
name = "a-share-research"
version = "0.0.0"
description = "Post-close A-share single-company research assistant"
requires-python = ">=3.13"
dependencies = [
    "akshare==1.18.64",
    "fastapi>=0.156.4",
    "jinja2>=3.1.6",
    "pandas",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "requests>=2.32",
    "tushare==1.4.29",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
    "E701",  # Multiple statements on one line (colon)
    "E731",  # Do not assign a lambda expression
]
