services:
  # 前端服务：FastAPI + Jinja 服务端 HTML、OAuth 认证、查询与任务提交
  web:
    image: a-share-research-web
    build:
      context: .
      target: web
    container_name: a-share-research-web
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"  # locally built image; no registry to pull from
    env_file: .env.web  # PUBLIC_BASE_URL, SESSION_SECRET, GITHUB_*; never model/TuShare credentials
    environment:
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR:-/home/lin/a-share-research-data}:/data
    networks:
      - nginx-network
    ports: ["127.0.0.1:8620:8620"]

  # 后端服务：异步任务 Worker，执行行情获取、PDF 财报抽取与模型推理
  worker:
    image: a-share-research-worker
    build:
      context: .
      target: worker
    container_name: a-share-research-worker
    restart: unless-stopped
    cpus: 0.6  # 2-core host shared with other services; model calls dominate research time
    labels:
      com.centurylinklabs.watchtower.enable: "false"  # locally built image; no registry to pull from
    env_file: .env  # TUSHARE_TOKEN, MODEL_PROVIDER, MODEL_ID, MODEL_REASONING, MODEL_MAX_TOKENS, MODEL_REVIEW_*, PI_*
    environment:
      DATA_DIR: /data
      METHOD_CARDS_DIR: /method-cards
    volumes:
      - ${DATA_DIR:-/home/lin/a-share-research-data}:/data
      - /home/lin/.pi:/home/lin/.pi
      # Reviewed analysis method cards maintained in the shared wiki; read-only, single-stock runs only.
      - ${METHOD_CARDS_SOURCE:-/home/lin/wiki/concepts/company-analysis}:/method-cards:ro

  # Explicit opt-in during consolidation; shares worker image, never its model credentials.
  tools:
    profiles: ["tools"]
    image: a-share-research-worker
    container_name: a-share-research-tools
    command: ["python", "-m", "a_share_research.tools.server", "--host", "0.0.0.0"]
    restart: unless-stopped
    cpus: 0.4
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    env_file:
      - path: .env.tools
        required: false
    environment:
      DATA_DIR: /data
      ASHARE_TOOLS_EXTERNAL_ENABLED: ${ASHARE_TOOLS_EXTERNAL_ENABLED:-0}
      ASHARE_TOOLS_EXTERNAL_REVIEW_ENABLED: ${ASHARE_TOOLS_EXTERNAL_REVIEW_ENABLED:-0}
      ASHARE_TOOLS_ACCOUNT_SHADOW_ENABLED: ${ASHARE_TOOLS_ACCOUNT_SHADOW_ENABLED:-0}
    volumes:
      - ${DATA_DIR:-/home/lin/a-share-research-data}:/data
    tmpfs:
      - /run/ashare-tools:uid=1000,gid=1000,mode=0700
    ports: ["127.0.0.1:8621:8621"]

networks:
  nginx-network:
    external: true
