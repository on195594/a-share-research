<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
{% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<title>{% block title %}个股研究{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
<script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body{% block body_attrs %}{% endblock %}>
<header class="shell">
  <a class="brand" href="/">个股研究</a>
  {% if csrf %}
  <nav class="shell-nav" aria-label="主要页面">
    <a href="/batches">候选初筛</a>
    <a href="/research-library">研究库</a>
    <a href="/policy"{% if request is defined and request.url.path == '/policy' %} aria-current="page"{% endif %}>投资政策</a>
  </nav>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link" type="submit">退出</button></form>
  {% endif %}
</header>
{% if csrf %}<aside class="device-preferences" aria-label="登录设备">
  {% if device_until %}<span>已记住此设备，至 {{ device_until }}（北京时间）；退出即取消。</span>
  {% else %}<form method="post" action="/auth/remember-device"><input type="hidden" name="return_path" value="{{ request.url.path }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link" type="submit">记住此设备 30 天</button><span>仅在自己的设备启用</span></form>{% endif %}
</aside>{% endif %}
<main{% if refresh %} data-refresh="{{ refresh }}" data-key="{{ refresh_key }}"{% endif %}>
{% block main %}{% endblock %}
</main>
</body>
</html>
